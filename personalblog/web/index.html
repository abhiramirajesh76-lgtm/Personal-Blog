<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500;1,6..72,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <button class="brand" id="brandBtn">
      <span class="brand-name" id="brandName">Your Name</span>
    </button>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="about">Home</button>
      <button class="tab-btn" data-tab="blog">Blog</button>
      <button class="tab-btn" data-tab="vlog">Vlog</button>
    </nav>

    <div class="owner-area" id="ownerArea"></div>
  </div>
</header>

<main class="wrap">

  <!-- ===================== ABOUT ===================== -->
  <section id="aboutTab" class="tab-panel">
    <div class="about-hero">
      <button class="photo-frame" id="photoFrame" title="Click to change photo" hidden>
        <img id="profilePhoto" alt="Profile photo" hidden>
        <span class="photo-placeholder" id="photoPlaceholder">Add a photo</span>
      </button>
      <h1 class="about-name" id="aboutName">Welcome</h1>
      <p class="about-synopsis" id="aboutSynopsis">This is your site. Sign in as the owner to add your photo, bio, and links.</p>

      <div class="social-row" id="socialRow"></div>

      <button class="edit-profile-btn" id="editProfileBtn" hidden>Edit profile</button>
    </div>
  </section>

  <!-- ===================== BLOG ===================== -->
  <section id="blogTab" class="tab-panel" hidden>
    <div class="blog-list-view" id="blogListView">
      <div class="panel-head">
        <div>
          <p class="eyebrow">writing</p>
          <h2>Blog</h2>
        </div>
        <button class="add-btn" id="newPostBtn" hidden>+ New post</button>
      </div>
      <div id="postsGrid" class="card-grid"></div>
    </div>

    <article class="post-detail" id="postDetailView" hidden>
      <button class="back-link" id="backFromPost">&larr; Back to Blog</button>
      <img id="postDetailImage" class="post-detail-image" alt="">
      <p class="entry-tag" id="postDetailTag"></p>
      <h1 id="postDetailTitle"></h1>
      <div class="post-detail-body" id="postDetailBody"></div>
      <button class="delete-btn" id="deletePostBtn" hidden>Delete this post</button>
    </article>
  </section>

  <!-- ===================== VLOG ===================== -->
  <section id="vlogTab" class="tab-panel" hidden>
    <div class="vlog-list-view" id="vlogListView">
      <div class="panel-head">
        <div>
          <p class="eyebrow">watching</p>
          <h2>Vlog</h2>
        </div>
        <button class="add-btn" id="newVlogBtn" hidden>+ New vlog</button>
      </div>
      <div id="vlogsGrid" class="card-grid vlog-grid"></div>
    </div>

    <article class="watch-view" id="vlogDetailView" hidden>
      <button class="back-link" id="backFromVlog">&larr; Back to Vlog</button>
      <video id="vlogPlayer" class="vlog-player" controls></video>
      <p class="entry-tag" id="vlogDetailTag"></p>
      <h1 id="vlogDetailTitle"></h1>
      <p class="vlog-detail-summary" id="vlogDetailSummary"></p>
      <button class="delete-btn" id="deleteVlogBtn" hidden>Delete this vlog</button>
    </article>
  </section>

</main>

<!-- ===================== DIALOGS ===================== -->

<dialog id="signInDialog">
  <form id="signInForm" class="card auth-form">
    <h2 id="signInTitle">Sign in</h2>
    <p class="dialog-hint" id="signInHint">Enter the site password to edit this page.</p>
    <label>Password<input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
    <p class="form-error" data-error-for="signInForm"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancelSignIn">Cancel</button>
      <button type="submit">Sign in</button>
    </div>
  </form>
</dialog>

<dialog id="profileDialog">
  <form id="profileForm" class="card profile-form" enctype="multipart/form-data">
    <h2>Edit profile</h2>
    <label>Photo <span class="optional">(optional — leave blank to keep current)</span>
      <input type="file" name="photo" accept="image/*">
    </label>
    <label>Name
      <input type="text" name="name" required placeholder="Your name">
    </label>
    <label>Synopsis
      <textarea name="synopsis" rows="4" required placeholder="A little about who you are"></textarea>
    </label>
    <label>Instagram — main <span class="optional">(full profile URL)</span>
      <input type="url" name="instagramMain" placeholder="https://instagram.com/yourhandle">
    </label>
    <label>Instagram — spam / second <span class="optional">(optional)</span>
      <input type="url" name="instagramSpam" placeholder="https://instagram.com/yourspamhandle">
    </label>
    <label>LinkedIn
      <input type="url" name="linkedin" placeholder="https://linkedin.com/in/yourname">
    </label>
    <p class="form-error" data-error-for="profileForm"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancelProfile">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="postDialog">
  <form id="postForm" class="card post-form" enctype="multipart/form-data">
    <h2>New blog post</h2>
    <label>Cover image
      <input type="file" name="image" accept="image/*" required>
    </label>
    <img id="postPhotoPreview" class="photo-preview" hidden alt="Preview">
    <label>Title
      <input type="text" name="title" required placeholder="Post title">
    </label>
    <label>Summary <span class="optional">(shows on the thumbnail)</span>
      <textarea name="summary" rows="2" required placeholder="One or two sentences"></textarea>
    </label>
    <label>Content
      <textarea name="content" rows="10" required placeholder="Write your post here. Leave a blank line between paragraphs."></textarea>
    </label>
    <p class="form-error" data-error-for="postForm"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancelPost">Cancel</button>
      <button type="submit">Publish</button>
    </div>
  </form>
</dialog>

<dialog id="vlogDialog">
  <form id="vlogForm" class="card post-form" enctype="multipart/form-data">
    <h2>New vlog post</h2>
    <label>Video file
      <input type="file" name="video" accept="video/*" required>
    </label>
    <label>Thumbnail image <span class="optional">(optional — a frame from the video works well)</span>
      <input type="file" name="thumbnail" accept="image/*">
    </label>
    <img id="vlogPhotoPreview" class="photo-preview" hidden alt="Preview">
    <label>Title
      <input type="text" name="title" required placeholder="Vlog title">
    </label>
    <label>Description
      <textarea name="summary" rows="4" required placeholder="What's this one about?"></textarea>
    </label>
    <p class="form-error" data-error-for="vlogForm"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancelVlog">Cancel</button>
      <button type="submit">Publish</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
