<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500;1,6..72,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <button class="brand" id="brandBtn">
      <span class="brand-name" id="brandName">Your Name</span>
    </button>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="about">Home</button>
      <button class="tab-btn" data-tab="blog">Blog</button>
      <button class="tab-btn" data-tab="vlog">Vlog</button>
    </nav>

  </div>
</header>

<main class="wrap">

  <!-- ===================== ABOUT ===================== -->
  <section id="aboutTab" class="tab-panel">
    <div class="about-hero">
      <div class="photo-frame" id="photoFrame">
        <img id="profilePhoto" alt="Profile photo" hidden>
        <span class="photo-placeholder" id="photoPlaceholder">Add a photo</span>
      </div>
      <h1 class="about-name" id="aboutName">Welcome</h1>
      <p class="about-synopsis" id="aboutSynopsis">This is your site.</p>

      <div class="social-row" id="socialRow"></div>
    </div>
  </section>

  <!-- ===================== BLOG ===================== -->
  <section id="blogTab" class="tab-panel" hidden>
    <div class="blog-list-view" id="blogListView">
      <div class="panel-head">
        <div>
          <p class="eyebrow">writing</p>
          <h2>Blog</h2>
        </div>
      </div>
      <div id="postsGrid" class="card-grid"></div>
    </div>

    <article class="post-detail" id="postDetailView" hidden>
      <button class="back-link" id="backFromPost">&larr; Back to Blog</button>
      <img id="postDetailImage" class="post-detail-image" alt="">
      <p class="entry-tag" id="postDetailTag"></p>
      <h1 id="postDetailTitle"></h1>
      <div class="post-detail-body" id="postDetailBody"></div>
    </article>
  </section>

  <!-- ===================== VLOG ===================== -->
  <section id="vlogTab" class="tab-panel" hidden>
    <div class="vlog-list-view" id="vlogListView">
      <div class="panel-head">
        <div>
          <p class="eyebrow">watching</p>
          <h2>Vlog</h2>
        </div>
      </div>
      <div id="vlogsGrid" class="card-grid vlog-grid"></div>
    </div>

    <article class="watch-view" id="vlogDetailView" hidden>
      <button class="back-link" id="backFromVlog">&larr; Back to Vlog</button>
      <div class="vlog-player-wrap">
        <iframe id="vlogPlayer" class="vlog-player" src="" title="" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
      <p class="entry-tag" id="vlogDetailTag"></p>
      <h1 id="vlogDetailTitle"></h1>
      <p class="vlog-detail-summary" id="vlogDetailSummary"></p>
    </article>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
